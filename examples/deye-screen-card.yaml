type: custom:deye-screen-card
solar: sensor.deye_pv_power            # потужність сонця / solar power, W
battery: sensor.deye_battery_power     # АКБ / battery, W: + розряд/discharge, − заряд/charge
battery_soc: sensor.deye_battery       # заряд АКБ / battery SoC, %
grid: sensor.deye_grid_power           # мережа / grid, W: + купівля/import, − продаж/export
load: sensor.deye_load_power           # споживання / load, W
grid_status: binary_sensor.deye_grid   # лампочка AC / AC LED (optional)
alarm: sensor.deye_device_state        # лампочка Alarm / Alarm LED: on/problem/Alarm/Fault (optional)
max: 8000                              # межа шкал / gauge limit, W (default 8000)
# frame: false                         # лише екран / screen only, no housing
